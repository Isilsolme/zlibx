name: Build Android APK

# Actions are pinned to commit SHAs (tag in a trailing comment) so a
# moved tag cannot change what runs. To bump an action, resolve the
# new tag's commit SHA and update both the SHA and the comment.
#
# Jobs:
#   check   - every push to main, every pull request, every tag:
#             'flutter analyze' and 'flutter test'. Nothing is built from
#             a red tree.
#   release - tag pushes (vX.Y.Z) and manual dispatch: builds the signed
#             arm64 release APK. On a tag it also publishes the GitHub
#             Release the in-app updater polls (/releases/latest ignores
#             prereleases, so the release must be a normal one).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64       base64 of the MD3 release keystore (zlibx-md3.jks)
#   KEYSTORE_PASSWORD     storePassword from android/key.properties
#   KEY_PASSWORD          keyPassword from android/key.properties
#   KEY_ALIAS             keyAlias (currently zlibx-md3)
#   EXPECTED_CERT_SHA256  optional: signing certificate SHA-256 fingerprint
#                         (uppercase hex, no colons). When set, a build with
#                         another key fails here instead of breaking every
#                         installed user's upgrade path at install time.
#
# The keystore in CI must be the SAME one used for v1.6.2 locally;
# otherwise existing users cannot upgrade in place
# (INSTALL_FAILED_UPDATE_INCOMPATIBLE).

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build (for traceability)'
        required: false
        default: 'Manual build'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release:
    name: Build signed release APK
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub Release on tag pushes

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Read version from pubspec
        id: pubspec
        run: |
          full=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d ' ')
          version=${full%+*}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Building version: $full"

      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          PUBSPEC_VERSION: ${{ steps.pubspec.outputs.version }}
        run: |
          expected="v$PUBSPEC_VERSION"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag '$TAG' does not match pubspec version '$expected'. Bump pubspec.yaml before tagging."
            exit 1
          fi

      # olib_api_plugin 现在是仓库内代码（vendor/olib_api_plugin/），pubspec
      # 用 path 依赖。只核对目录在场，不再 clone 私有仓库、不跑 codegen。
      - name: Verify in-repo olib_api_plugin
        run: |
          if [ ! -f vendor/olib_api_plugin/pubspec.yaml ] || [ ! -f vendor/olib_api_plugin/lib/olib_api_plugin.dart ]; then
            echo "::error::vendor/olib_api_plugin/ is missing from the repo. It must be committed (check .gitignore does not exclude vendor/)."
            exit 1
          fi
          echo "olib_api_plugin present in repo:"
          ls vendor/olib_api_plugin/lib/ vendor/olib_api_plugin/lib/src/

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is missing. Configure the signing secrets before releasing."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/zlibx-md3.jks
          # android/app/build.gradle.kts resolves storeFile relative to android/app.
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=zlibx-md3.jks"
          } > android/key.properties
          echo "Keystore restored. File sizes:"
          wc -c android/app/zlibx-md3.jks android/key.properties

      - name: Build release APK
        # --obfuscate renames Dart symbols in the shipped snapshot (smaller
        # + harder to read); the mapping lands in the split-debug-info
        # directory and is uploaded as a separate artifact below, so crash
        # de-symbolization keeps working.
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --android-project-arg=kotlin.incremental=false \
            --android-project-arg=ksp.incremental=false

      - name: Rename APK and compute checksum
        id: artifacts
        run: |
          cd build/app/outputs/flutter-apk
          v="${{ steps.pubspec.outputs.version }}"

          mv app-release.apk "zlibx-v$v.apk"

          rm -f *.apk.sha1 *-debug.apk

          echo "Output files:"
          ls -lh

          sha256sum *.apk > sha256sums.txt
          echo "--- sha256sums.txt ---"
          cat sha256sums.txt

          apk_bytes=$(stat -c%s *.apk)
          echo "APK size: ${apk_bytes} bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA-256: $(cut -d' ' -f1 sha256sums.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify keystore signature
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          cd build/app/outputs/flutter-apk
          v="${{ steps.pubspec.outputs.version }}"
          apk="zlibx-v$v.apk"
          apksigner_bin=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -z "$apksigner_bin" ]; then
            echo "::error::apksigner not found; cannot verify the signing certificate."
            exit 1
          fi
          "$apksigner_bin" verify --print-certs "$apk" | tee certs.txt

          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            actual=$(grep -i 'SHA-256 digest' certs.txt | head -n1 | sed 's/.*: //' | tr -d ': ' | tr '[:lower:]' '[:upper:]')
            expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:lower:]' '[:upper:]')
            if [ "$actual" != "$expected" ]; then
              echo "::error::APK signed with an unexpected certificate. Expected $expected, got $actual. Installed users could not upgrade."
              exit 1
            fi
            echo "Signing certificate matches EXPECTED_CERT_SHA256."
          fi

      - name: Cleanup signing material (defence in depth)
        if: always()
        run: |
          rm -f android/app/zlibx-md3.jks android/key.properties build/app/outputs/flutter-apk/certs.txt
          echo "Signing material removed from runner."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zlibx-android-v${{ steps.pubspec.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/zlibx-*.apk
            build/app/outputs/flutter-apk/sha256sums.txt
          retention-days: 30

      # --obfuscate 的符号映射表（app.android-arm64.symbols）：单独存一份
      # 构建产物，和 APK 同样的 30 天保留期；发布版崩溃堆栈靠它反解。
      - name: Upload Dart symbols for de-obfuscation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zlibx-android-v${{ steps.pubspec.outputs.version }}-symbols
          path: build/app/outputs/symbols
          retention-days: 30

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: zlibx ${{ github.ref_name }}
          # 正文不由工作流生成：发版时在草稿里写好说明；
          # action 更新已有 Release 时 body 为空会保留原正文。
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/zlibx-*.apk
            build/app/outputs/flutter-apk/sha256sums.txt
            build/app/outputs/symbols/*
