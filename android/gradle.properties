org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier off: every plugin in this project is already AndroidX.
# If a future plugin still ships the old support library, flip this
# back to true and note which plugin needs it.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Plugins (rive_native, etc.) compile Java/Kotlin at
# inconsistent JVM targets. ART/D8 handle the mix fine; downgrade KGP's strict
# validation so the build doesn't fail on this. Don't force-align via JavaCompile
# task overrides — that strips android.jar from the bootclasspath.
kotlin.jvm.target.validation.mode=ignore
